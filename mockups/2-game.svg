<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3f7a" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#241f30" stop-opacity="1"/>
      <stop offset="1" stop-color="#1c1e22" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#1c1e22"/>
  <rect width="1280" height="260" fill="url(#hdr)"/>

  <!-- обложка + название -->
  <rect x="55" y="38" width="120" height="120" rx="16" fill="#3a2f4a"/>
  <text x="200" y="82" font-size="30" fill="#ffffff" font-weight="600">DOOM Eternal</text>
  <text x="200" y="112" font-size="20" fill="#a4a9b6">Достижения: 0 / 34</text>

  <!-- панель прогресса -->
  <rect x="55" y="176" width="1170" height="76" rx="16" fill="#2c2f35"/>
  <text x="85" y="206" font-size="19" fill="#dde2ea">Получено достижений: 0/34 (0%)</text>
  <rect x="85" y="220" width="1110" height="12" rx="6" fill="#3c4048"/>

  <!-- тумблер -->
  <text x="55" y="306" font-size="19" fill="#c3c8d2">Только невыполненные</text>
  <rect x="1138" y="277" width="64" height="34" rx="17" fill="#464a52"/>
  <circle cx="1155" cy="294" r="12" fill="#fafbfe"/>

  <!-- центральный блок: пустое состояние -->
  <g>
    <circle cx="640" cy="400" r="46" fill="#24272c"/>
    <circle cx="640" cy="400" r="46" fill="none" stroke="#3a3f47" stroke-width="2"/>
    <text x="640" y="410" font-size="34" fill="#8ea6c8" text-anchor="middle">+</text>

    <text x="640" y="492" font-size="26" fill="#e8ecf4" text-anchor="middle" font-weight="600">Достижений пока нет</text>
    <text x="640" y="524" font-size="18" fill="#8f94a2" text-anchor="middle">Найди эту игру в Steam — достижения, иконки и описания подтянутся сами</text>

    <rect x="420" y="556" width="440" height="60" rx="16" fill="#2f5f8f"/>
    <rect x="420" y="556" width="440" height="60" rx="16" fill="none" stroke="#5aa2e0" stroke-width="2"/>
    <circle cx="470" cy="586" r="16" fill="#eaf2fb"/>
    <text x="470" y="592" font-size="16" fill="#22303f" text-anchor="middle" font-weight="700">X</text>
    <text x="502" y="593" font-size="20" fill="#f2f7ff">Найти достижения в Steam</text>
  </g>

  <text x="55" y="694" font-size="15" fill="#6d7280">Кнопка кликабельна тачем, а X — то же самое с любой клавиатуры/геймпада</text>
</svg>
